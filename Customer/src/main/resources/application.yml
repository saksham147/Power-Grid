server:
  port: 8091

spring:
  application:
    name: customer-service

  # No datasource. Zones and demand both live in Redis; Postgres has no place here.
  data:
    redis:
      host: localhost
      port: 6379
      # A slow Redis must not hold up a tick. The adapter is fire-and-forget, but a
      # bounded timeout stops a hung connection pinning resources either way.
      timeout: 2s
      connect-timeout: 2s

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: customer-service
      # A restarting Customer should join the live tick stream, not replay a backlog of stale
      # ticks and publish demand for simulated time that has already passed.
      auto-offset-reset: latest
    producer:
      # A tick publishes one record per zone. Waiting a few milliseconds lets them
      # leave as a single request instead of one round trip each.
      linger-ms: 20
      compression-type: lz4
      # Leader acknowledgement only. Losing a tick of demand to a broker failure costs
      # one sample of a continuous signal; the next tick is five seconds behind it.
      acks: "1"
      properties:
        # THE important one. KafkaTemplate.send waits on topic metadata, and on buffer
        # space when the accumulator is full, for up to max.block.ms -- which defaults
        # to 60 SECONDS. On a five second tick an unreachable broker would freeze the
        # simulation rather than merely costing it events.
        #
        # Not lower than this, though: measured, the first send in a fresh JVM spends
        # ~500 ms establishing the connection, so a tighter bound drops the first tick
        # after every restart. Warm sends take ~400 microseconds. The publisher's own
        # budget is what stops N zones each paying this against a dead broker.
        max.block.ms: 2000
        # Give up on a record after two ticks. By the time a longer retry succeeded, the
        # figure would describe a moment already superseded by fresher demand, and the
        # accumulator would be filling with stale records meanwhile.
        request.timeout.ms: 4000
        delivery.timeout.ms: 10000

customer:
  simulation:
    # Whether the grid.tick @KafkaListener auto-starts. Off in tests, so loading the context
    # does not consume real ticks from a real broker and emit real demand.
    autostart: true
    # Must match Grid's own (hardcoded) pace: Grid is the one clock now, and these feed only
    # this service's own copy of the tick/time-of-day math, not the tick number itself.
    simulated-minutes-per-tick: 5
    real-seconds-per-simulated-minute: 1

  # The zones an installation starts with. Read once, at first boot, to seed Redis -- see
  # RedisZoneRepository -- and never again after that: POST/PUT/DELETE /api/zones is how the
  # fleet changes from here on, and it changes Redis, not this file.
  #
  # A zone is a pure container now -- see Zone and DemandModel -- so there is nothing here but
  # an id and a name. Its demand comes entirely from the units seeded below.
  zones:
    - id: Z-NORTH
      name: North Residential
    - id: Z-CENTRAL
      name: Central Commercial
    - id: Z-EAST
      name: East Industrial

  # The houses, factories and commercial buildings an installation starts with, each belonging
  # to one of the zones above. Read once, at first boot, to seed Redis -- see
  # RedisConsumerUnitRepository -- and never again after that: POST/PUT/DELETE /api/units is how
  # the fleet changes from here on.
  #
  # capacity-kw is a unit's rated demand at a profile factor of 1.0 -- see DemandModel -- sized
  # like a real building (hundreds to low thousands of kW), not a population.
  units:
    - unit-id: U-NORTH-A
      zone-id: Z-NORTH
      name: North Homes A
      type: RESIDENTIAL
      capacity-kw: 800
    - unit-id: U-NORTH-B
      zone-id: Z-NORTH
      name: North Homes B
      type: RESIDENTIAL
      capacity-kw: 650
    - unit-id: U-CENTRAL-A
      zone-id: Z-CENTRAL
      name: Central Offices
      type: COMMERCIAL
      capacity-kw: 1200
    - unit-id: U-CENTRAL-B
      zone-id: Z-CENTRAL
      name: Central Mall
      type: COMMERCIAL
      capacity-kw: 900
    - unit-id: U-EAST-A
      zone-id: Z-EAST
      name: East Plant
      type: INDUSTRIAL
      capacity-kw: 2000

logging:
  level:
    Customer: DEBUG
