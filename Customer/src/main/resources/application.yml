spring:
  application:
    name: customer-service

  # No datasource and no web server. Zones are configuration, demand is a Redis
  # snapshot, and nothing calls this service -- it only writes to Redis and Kafka.
  data:
    redis:
      host: localhost
      port: 6379
      # A slow Redis must not hold up a tick. The adapter is fire-and-forget, but a
      # bounded timeout stops a hung connection pinning resources either way.
      timeout: 2s
      connect-timeout: 2s

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # A tick publishes one record per zone. Waiting a few milliseconds lets them
      # leave as a single request instead of one round trip each.
      linger-ms: 20
      compression-type: lz4
      # Leader acknowledgement only. Losing a tick of demand to a broker failure costs
      # one sample of a continuous signal; the next tick is five seconds behind it.
      acks: "1"
      properties:
        # THE important one. KafkaTemplate.send waits on topic metadata, and on buffer
        # space when the accumulator is full, for up to max.block.ms -- which defaults
        # to 60 SECONDS. On a five second tick an unreachable broker would freeze the
        # simulation rather than merely costing it events.
        #
        # Not lower than this, though: measured, the first send in a fresh JVM spends
        # ~500 ms establishing the connection, so a tighter bound drops the first tick
        # after every restart. Warm sends take ~400 microseconds. The publisher's own
        # budget is what stops N zones each paying this against a dead broker.
        max.block.ms: 2000
        # Give up on a record after two ticks. By the time a longer retry succeeded, the
        # figure would describe a moment already superseded by fresher demand, and the
        # accumulator would be filling with stale records meanwhile.
        request.timeout.ms: 4000
        delivery.timeout.ms: 10000

customer:
  simulation:
    # 24 h / 288 ticks, the same cadence Producer runs at, so zone demand and plant
    # output line up tick for tick once Distributor consumes both.
    simulated-minutes-per-tick: 5
    # The simulation speed: one real second of wall clock per simulated minute.
    # Together with the line above this makes a tick fire every 5 real seconds.
    real-seconds-per-simulated-minute: 1

  # Customer counts are populations, not object counts -- see DemandModel. A zone of
  # two million costs the same per tick as a zone of twenty.
  #
  # Two spreads, because they behave differently at scale. customer-variability is
  # independent between customers, so its share of the zone total falls away as
  # 1/sqrt(N) and a large zone barely feels it. zone-variability is shared by the whole
  # zone -- weather, daylight, a televised event -- so it does not shrink, and it is
  # what keeps a million-customer zone from flatlining.
  zones:
    - id: Z-NORTH
      name: North Residential
      customers: 250000
      profile: RESIDENTIAL
      base-kw-per-customer: 1.1
      customer-variability: 0.35
      zone-variability: 0.06
    - id: Z-CENTRAL
      name: Central Commercial
      customers: 40000
      profile: COMMERCIAL
      base-kw-per-customer: 7.5
      customer-variability: 0.25
      zone-variability: 0.05
    - id: Z-EAST
      name: East Industrial
      customers: 800
      profile: INDUSTRIAL
      base-kw-per-customer: 240.0
      customer-variability: 0.12
      zone-variability: 0.03

logging:
  level:
    Customer: DEBUG
