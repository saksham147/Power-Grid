name: powergrid

services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: powergrid
      POSTGRES_USER: powergrid
      POSTGRES_PASSWORD: powergrid
    command:
      # The tick engine holds one connection per worker thread; the app's Hikari pool is
      # sized at 50, so the server must comfortably exceed that.
      - "postgres"
      - "-c"
      - "max_connections=200"
    ports:
      # Host port 5433, not 5432: a native PostgreSQL service may already own 5432, and a
      # published container port loses to it silently -- connections reach the wrong server and
      # fail authentication rather than refusing, which is a confusing way to lose an afternoon.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U powergrid -d powergrid"]
      interval: 5s
      timeout: 5s
      retries: 10
    # See the "application services" comment block below for why every service in this file
    # now carries a memory ceiling.
    mem_limit: 256m
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: local_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@email.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy # Updated to wait for the healthcheck
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    mem_limit: 300m

  redis:
    image: redis:latest
    command: ["redis-server", "--appendonly", "yes", "--databases", "16"]
    ports:
      # Host port 6380, not 6379: a Redis already installed on this machine owns 6379, and the
      # published container port would lose to it (or fail to bind at all). Only the *host* side
      # moves -- containers still reach this one at redis:6379 over the Compose network, which is
      # why the services' SPRING_DATA_REDIS_PORT below stays "6379".
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 100m
    restart: unless-stopped

  kafka:
    image: apache/kafka:latest
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk" # REQUIRED: Added missing Cluster ID for KRaft
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Updated listener bindings to explicitly bind to all interfaces (0.0.0.0)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Unset, the broker's own JVM sizes its heap off whatever memory it can see -- which
      # without this cap would be this whole host's, not this container's 420m ceiling.
      KAFKA_HEAP_OPTS: "-Xmx224m -Xms224m"
      # The log cleaner reserves a 128 MB dedupe buffer by default -- more than half of the heap
      # capped above -- and the broker dies at startup with "OutOfMemoryError: Java heap space"
      # in LogCleaner (then restart-loops forever). It only compacts __consumer_offsets here, so
      # 16 MB is plenty.
      KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: "16777216"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    mem_limit: 420m
    restart: unless-stopped

  # ---- application services -------------------------------------------------------------
  #
  # None of the five change application.yml: every localhost/5433 default in there is still
  # correct for running a service directly on the host (./mvnw spring-boot:run), which stays a
  # valid way to work on one service. These `environment:` blocks are Spring Boot's own
  # relaxed-binding env-var overrides (spring.datasource.url -> SPRING_DATASOURCE_URL, etc.),
  # supplying container-network values -- the Postgres/Kafka/Redis service names Compose's
  # built-in DNS resolves, and Kafka's INTERNAL listener (kafka:29092) rather than the
  # PLAINTEXT one the host uses (localhost:9092) -- only when running under Compose.
  #
  # Every service below (and every infra one above) now also carries a `mem_limit`. Found live,
  # the hard way: with none set, all nine containers compete for the same unbounded pool the
  # Docker/WSL2 VM happens to have (3.6 GB here) -- five JVMs each sizing a chunk of the *whole
  # visible pool* is exactly how one of them tips the total over the edge and the VM's own OOM
  # killer takes down every container at once, Postgres and Kafka included, with no relation to
  # which one actually grew. A per-container ceiling turns that into, at worst, one container
  # restarting alone. Each Java service's Dockerfile pairs its ceiling with
  # `-XX:MaxRAMPercentage`, so the JVM sizes its heap off *this* number, not the host's.

  producer:
    build:
      context: ./Producer
    ports:
      - "8090:8090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/powergrid
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    mem_limit: 400m
    restart: unless-stopped

  customer:
    build:
      context: ./Customer
    ports:
      - "8091:8091"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    mem_limit: 340m
    restart: unless-stopped

  grid:
    build:
      context: ./Grid
    ports:
      - "8092:8092"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    mem_limit: 340m
    restart: unless-stopped

  distributor:
    build:
      context: ./Distributor
    ports:
      - "8093:8093"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/powergrid
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    mem_limit: 400m
    restart: unless-stopped

  billing:
    build:
      context: ./Billing
    ports:
      - "8094:8094"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/powergrid
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    mem_limit: 380m
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
    ports:
      - "5173:5173"
    environment:
      # Service names, not localhost -- see vite.config.js's own comment on why.
      PRODUCER_HOST: producer
      CUSTOMER_HOST: customer
      GRID_HOST: grid
      DISTRIBUTOR_HOST: distributor
      BILLING_HOST: billing
      # Vite's file watcher (chokidar) misses change events on a bind-mounted volume under
      # Docker Desktop on Windows/macOS without this -- the underlying filesystem event API
      # doesn't cross the VM boundary the mount is proxied through.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      # Live source, so editing on the host hot-reloads exactly like a local `npm run dev`.
      - ./Frontend:/app
      # ...except node_modules: masks the bind mount for just this one path with a volume
      # populated by `npm install` *inside* the container, so it holds Linux-native
      # esbuild/rollup binaries rather than whatever the host's own `npm install` produced.
      - frontend-node-modules:/app/node_modules
    depends_on:
      - producer
      - customer
      - grid
      - distributor
      - billing
    mem_limit: 350m
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  pgadmin-data:
  frontend-node-modules: