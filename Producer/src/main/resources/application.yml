server:
  # Pinned rather than left on 8080. The other four services will each want a port of their own
  # and they all run on the host, so the default would become a collision the moment Grid boots.
  port: 8090

spring:
  application:
    name: producer-service

  datasource:
    # Port 5433, not 5432 -- docker-compose publishes there so a native Postgres install cannot
    # silently win the port.
    url: jdbc:postgresql://localhost:5433/powergrid
    username: powergrid
    password: powergrid

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        # Producer solely owns power_plant. Its own schema keeps the database-per-service boundary
        # without forking the shared compose infrastructure into five databases.
        default_schema: producer
        jdbc:
          # Makes the per-tick write-back one batched round trip rather than one UPDATE per plant.
          batch_size: 50
        order_updates: true
      jakarta:
        persistence:
          # Hibernate emits CREATE SCHEMA for default_schema above; without this it would assume
          # the schema already exists and fail on a fresh database.
          create-database-schemas: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: producer-service
      # A restarting Producer should join the live tick stream, not replay a backlog of stale ticks
      # and publish outputs for simulation time that has already passed.
      auto-offset-reset: latest

producer:
  # No history config left here on purpose: generation_record is a TimescaleDB hypertable and
  # generation_rollup a continuous aggregate over it (one row per plant per real minute -- exactly
  # one simulated hour, which keeps the daily solar curve). Both the 24h raw retention and the 10m
  # aggregate refresh are policies on the database itself, set once via SQL by
  # Producer.model.GenerationHypertableSetup (see Producer.model.GenerationHypertableSetup#RAW_RETENTION
  # for the single source of truth on the retention window), not application config.

  roster-sync:
    # Re-announce every plant on producer.plants at startup and then this often, so Billing's
    # mirror of the roster can always be rebuilt from the topic -- see
    # Producer.kafka.PlantRosterSync. ISO-8601 (Duration), like Billing's own intervals.
    enabled: true
    interval: PT10M

  simulation:
    # Whether the grid.tick @KafkaListener auto-starts. Off in tests, so loading the context does
    # not consume real ticks from a real broker. The pace and the frequency deviation both come
    # from Grid now -- see Grid's own application.yml.
    autostart: true

logging:
  level:
    Producer: DEBUG
