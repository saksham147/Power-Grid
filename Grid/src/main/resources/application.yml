server:
  port: 8092

spring:
  application:
    name: grid-service

  datasource:
    # Port 5433, not 5432 -- docker-compose publishes there so a native Postgres install cannot
    # silently win the port.
    url: jdbc:postgresql://localhost:5433/powergrid
    username: powergrid
    password: powergrid

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        # Grid solely owns tick_record -- its own schema keeps the database-per-service
        # boundary without forking the shared compose infrastructure.
        default_schema: grid
      jakarta:
        persistence:
          # Hibernate emits CREATE SCHEMA for default_schema above; without this it would assume
          # the schema already exists and fail on a fresh database.
          create-database-schemas: true

  data:
    redis:
      host: localhost
      # 6380, not 6379: docker-compose publishes Redis there so a native Redis install can't
      # collide with it. (Inside Compose, SPRING_DATA_REDIS_PORT overrides this back to 6379.)
      port: 6380
      timeout: 2s
      connect-timeout: 2s

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: grid-service
      # A restarting Grid should join the live output/balance stream, not replay a backlog of
      # stale figures and compute a deviation for simulated time that has already passed.
      auto-offset-reset: latest
    producer:
      # A tick is one record; nothing to batch. Kept short anyway so a slow broker
      # cannot silently stretch the tick interval.
      properties:
        max.block.ms: 2000
        request.timeout.ms: 4000
        delivery.timeout.ms: 10000

grid:
  simulation:
    # Start ticking when the application is ready, and start the producer.output /
    # distributor.zone-balance listeners with it. The context test switches this off so that
    # loading the context does not tick or consume against real Redis and Kafka.
    autostart: true
    # Starting grid frequency deviation in Hz. Only the starting value while auto-control is on --
    # see below -- since every tick after the first overwrites it with Grid's own computation.
    frequency-deviation: 0.0
    # Whether Grid computes its own deviation from Producer's and Distributor's published figures
    # each tick, rather than only ever carrying whatever a human last set through the API.
    auto-control: true
    # Hz of deviation per 100% of demand the fleet is mismatched by -- see FrequencyController.
    auto-control-gain: 2.0
    # Clamp on the computed deviation, in Hz. Matches FrequencyDeviationRequest's own manual
    # bound, so automatic and manual control never disagree about how far this model may drift.
    auto-control-max-deviation: 0.25

  clock:
    # How many times Grid tries to read its saved tick from Redis at boot, and how long it waits
    # between tries, before giving up and starting at tick 0 -- see Grid.redis.RedisClockStore for
    # why starting at 0 is something to avoid. ISO-8601 (Duration), like the rest of the stack.
    resume-attempts: 10
    resume-retry-delay: PT3S

  history:
    # Wall-clock, not simulated-day, retention -- like Producer's own raw generation history, this
    # is for a live chart, not long-term accounting, so there is no rollup tier keeping older data
    # in a compressed form the way Billing/Distributor need for cost totals. A row aged past this
    # is just deleted. ISO-8601 (Duration).
    raw-retention: 24h
    prune-interval: 10m
    prune-enabled: true

logging:
  level:
    Grid: DEBUG
