# Serves the built dashboard and reverse-proxies the five backend APIs -- the same job
# vite.config.js's `server.proxy` does in dev, with the same prefixes and the same rewrites.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Upstreams below are variables so nginx resolves them per request:
    # with literal hostnames nginx would refuse to start ("host not found in upstream") whenever
    # a backend container isn't up yet, and a restarted backend (new IP) would never be re-resolved.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Default is 30s: one lost DNS answer would hang that request for half a minute.
    resolver_timeout 3s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript text/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # With a variable in proxy_pass and no URI part, nginx forwards the request URI as it stands
    # after any `rewrite ... break`, query string included.

    # Producer: /api/... is passed through untouched.
    location /api/ {
        set $upstream producer:8090;
        proxy_pass http://$upstream;
    }

    # The other four expose their API at /api/... on their own port, so their prefix is rewritten
    # to /api -- exactly what vite.config.js does. `set` must come BEFORE `rewrite ... break`:
    # break ends the rewrite-module directives, so a `set` placed after it silently never runs.
    location /customer-api/ {
        set $upstream customer:8091;
        rewrite ^/customer-api/(.*)$ /api/$1 break;
        proxy_pass http://$upstream;
    }

    location /grid-api/ {
        set $upstream grid:8092;
        rewrite ^/grid-api/(.*)$ /api/$1 break;
        proxy_pass http://$upstream;
    }

    location /distributor-api/ {
        set $upstream distributor:8093;
        rewrite ^/distributor-api/(.*)$ /api/$1 break;
        proxy_pass http://$upstream;
    }

    location /billing-api/ {
        set $upstream billing:8094;
        rewrite ^/billing-api/(.*)$ /api/$1 break;
        proxy_pass http://$upstream;
    }

    # Vite fingerprints everything in /assets with a content hash, so it can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html is what points at the current hashed assets, so it must never be cached.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
